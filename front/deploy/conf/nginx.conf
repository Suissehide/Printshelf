server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Gros modèles et sauvegardes : même limite que le back (bodyLimit 50 Mo).
  client_max_body_size 50m;

  location /api/ {
    proxy_pass http://back:4747;
    # Le back vérifie l'hôte (ALLOWED_HOSTS) : on lui transmet celui demandé par le navigateur.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    # Les modèles peuvent peser plusieurs centaines de Mo : on les transmet en flux.
    proxy_buffering off;
  }

  # Fichiers versionnés par Vite : cache long.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Routage côté client (TanStack Router).
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
